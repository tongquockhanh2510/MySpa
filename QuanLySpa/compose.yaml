services:
  mariadb:
    image: mariadb:11.3
    container_name: myspa-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: Spa_Phuong_Thao_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: myspa-redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: myspa-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - mariadb
      - redis
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  mariadb_data:
