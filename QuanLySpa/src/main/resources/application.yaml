spring:
  application:
    name: QuanLySpa_Backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        default_batch_fetch_size: 20

  security:
    oauth2:
      client:
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  charset:
    console: UTF-8
    file: UTF-8

app:
  upload-dir: uploads
  cors:
    # Danh sach origin frontend production, cach nhau boi dau phay, vd: https://myspa-frontend.onrender.com
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:}
  pricing:
    vat-inclusive: ${VAT_INCLUSIVE:true}
    vat-rate: ${VAT_RATE:10}
  business:
    opening-time: ${SPA_OPENING_TIME:08:00}
    closing-time: ${SPA_CLOSING_TIME:21:00}
    buffer-minutes: ${SPA_BUFFER_MINUTES:10}
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    channel: ${REMINDER_CHANNEL:IN_APP}
    provider-url: ${REMINDER_PROVIDER_URL:}
    api-key: ${REMINDER_API_KEY:}
    poll-ms: ${REMINDER_POLL_MS:300000}
    scan-window-minutes: ${REMINDER_SCAN_WINDOW_MINUTES:5}

# Thanh toan chuyen khoan ngan hang (VietQR + webhook bao co tu SePay/Casso)
