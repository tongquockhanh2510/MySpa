spring:
  application:
    name: ModaMint_Backend

  # Cấu hình upload file
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB # Giới hạn kích thước mỗi file
      max-request-size: 50MB # Giới hạn tổng kích thước request (nhiều files)

  datasource:
    url: jdbc:mariadb://localhost:3306/Spa_Phuong_Thao_db?authenticationPlugins=mysql_native_password
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

  security:
    oauth2:
      client:
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
